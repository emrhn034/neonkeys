<!doctype html><html lang="tr"><meta charset="utf-8"><title>NeonKeys · Overlay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;overflow:hidden;font-family:Segoe UI,Arial,sans-serif;color:#d8dcec}body{--accent:#9d7aff;--rgb:157,122,255;--second:#59efdc}.rig{width:740px;padding:30px;transform-origin:top left}.head{display:flex;align-items:center;gap:10px;margin:0 0 16px 3px;font-size:10px;font-weight:700;letter-spacing:3px;color:#a5aec5}.mark{width:6px;height:6px;background:var(--second);box-shadow:0 0 12px var(--second);border-radius:50%}.rule{height:1px;background:linear-gradient(90deg,#ffffff22,transparent);flex:1;margin-left:10px}.setup{display:flex;gap:20px;align-items:flex-end}.board{display:flex;flex-direction:column;gap:7px}.row{display:flex;gap:7px}.key{position:relative;width:51px;height:48px;border:1px solid #ffffff1a;border-radius:9px;background:linear-gradient(155deg,#202638f5,#101522f5);box-shadow:0 4px 0 #080b13,0 5px 8px #0005,inset 0 1px 0 #ffffff0c;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;transition:background 70ms,box-shadow 80ms,color 70ms,transform 60ms;isolation:isolate}.key small{position:absolute;bottom:5px;font-size:6px;font-weight:600;letter-spacing:1px;color:#818ba2}.key.feature{border-color:#9d7aff48;color:#cbbbff}.key.move{border-color:#59efdc38;color:#a8eee5}.key.on{transform:translateY(3px);background:var(--accent);color:#100c22;border-color:#ffffff80;box-shadow:0 1px 0 #473070,0 0 22px rgba(var(--rgb),.42),inset 0 1px 0 #ffffff66}.key.on small{color:#241740}.key.move.on{background:var(--second);box-shadow:0 1px 0 #1b6d65,0 0 22px #59efdc55;color:#073c35}.key.wide{width:80px;font-size:10px;letter-spacing:1px}.key.space{width:283px;font-size:9px;letter-spacing:4px}.key.tab{width:64px;font-size:9px}.mouse{width:85px;height:126px;position:relative;background:linear-gradient(140deg,#1e2536f5,#101522f5);border:1px solid #ffffff20;border-radius:31px 31px 36px 36px;box-shadow:0 6px 0 #080b13,0 10px 20px #0004;overflow:hidden;margin:0 0 4px}.mouse .button{position:absolute;top:0;width:50%;height:55px;background:#ffffff02;transition:background 60ms,box-shadow 60ms}.mouse .left{left:0;border-right:1px solid #ffffff15}.mouse .right{right:0}.mouse .button.on{background:var(--accent);box-shadow:0 0 25px rgba(var(--rgb),.5)}.wheel{position:absolute;top:16px;left:36px;width:11px;height:23px;border:2px solid #828a9f;border-radius:5px;background:#0b101c}.wheel.on{background:var(--second);border-color:var(--second)}.mouse:after{content:'N';position:absolute;bottom:20px;left:34px;font-weight:800;font-size:16px;font-style:italic;color:#ffffff30}.footer{margin-top:17px;display:flex;align-items:center;gap:8px;font-size:8px;letter-spacing:2px;color:#717e98}.footer:before{content:'';width:20px;height:2px;background:linear-gradient(90deg,var(--accent),var(--second))}.demo{display:none;margin-left:auto;color:var(--second)}body.demo-mode .demo{display:block}.no-mouse .mouse{display:none}
.rig{width:560px}.only-keyboard .rig{width:460px}.only-keyboard .mouse{display:none}.only-mouse .rig{width:260px}.only-mouse .board{display:none}.only-mouse .setup{height:230px;justify-content:center;align-items:center}.only-mouse .mouse{transform:scale(1.5);margin:0}
/* Glass: translucent, rounded keycaps with a frosted panel. */
.design-glass .setup{padding:12px;border:1px solid #ffffff26;border-radius:22px;background:linear-gradient(130deg,#ffffff17,#ffffff05);box-shadow:inset 0 1px 0 #ffffff22}.design-glass .key{border-radius:12px;background:linear-gradient(140deg,#d8e8ff28,#809bc00e);border-color:#d6eaff40;box-shadow:0 3px 12px #0002,inset 0 1px 0 #ffffff24}.design-glass .key.on{background:rgba(var(--rgb),.85);box-shadow:0 0 23px rgba(var(--rgb),.5)}.design-glass .key.move.on{background:var(--second)}.design-glass .mouse{background:linear-gradient(140deg,#d8e8ff28,#809bc012);border-color:#d6eaff55;box-shadow:inset 0 1px 0 #ffffff22}.design-glass .key.wide{width:73px}.design-glass .key.space{width:276px}
/* Minimal: flat monochrome outlines, no glow or ability captions. */
.design-minimal .key{border-radius:3px;background:#10131bd9;box-shadow:none;border-color:#ffffff65;color:#f3f5fa;font-weight:400}.design-minimal .key small{display:none}.design-minimal .key.on,.design-minimal .key.move.on{background:#f3f5fa;color:#121522;border-color:white;box-shadow:none;transform:translateY(1px)}.design-minimal .mouse{border-radius:28px;background:#10131bd9;border-color:#ffffff70;box-shadow:none}.design-minimal .mouse .button.on{background:#f3f5fa;box-shadow:none}.design-minimal .wheel.on{background:#f3f5fa;border-color:#f3f5fa}.design-minimal .mark{background:#f3f5fa;box-shadow:none}.design-minimal .footer:before{background:#f3f5fa}.design-minimal .head{letter-spacing:4px}
/* Arcade: blocky caps, deep stepped edges and an offset cabinet. */
.design-arcade{font-family:Consolas,monospace}.design-arcade .key{border-radius:0;border:2px solid #ffffff4a;background:#171128;box-shadow:3px 4px 0 #000a,inset 2px 2px 0 #ffffff14;font-weight:800}.design-arcade .key.on{background:var(--accent);box-shadow:1px 1px 0 #000a;transform:translate(2px,3px)}.design-arcade .key.move.on{background:var(--second)}.design-arcade .mouse{border-radius:10px;background:#171128;border:2px solid #ffffff4a;box-shadow:4px 5px 0 #0009}.design-arcade .wheel{border-radius:0}.design-arcade .mark{border-radius:0;box-shadow:3px 3px 0 #000}.design-arcade .rule{height:3px;background:repeating-linear-gradient(90deg,var(--accent) 0 7px,transparent 7px 12px);opacity:.5}.design-arcade .head{color:#e7daff}.design-arcade .footer{font-weight:700}
</style>
<div class="rig"><div class="head"><span class="mark"></span><span id="name">NEON / KEYS</span><span class="rule"></span></div><div class="setup"><div class="board" id="board"></div><div class="mouse"><div class="button left" data-vk="1"></div><div class="button right" data-vk="2"></div><div class="wheel" data-vk="4"></div></div></div><div class="footer"><span id="status">BAĞLANIYOR</span><span class="demo">TASARIM ÖNİZLEMESİ</span></div></div>
<script>
const q=new URLSearchParams(location.search),theme=q.get('theme');
if(theme==='ice'){document.body.style.setProperty('--accent','#69cfff');document.body.style.setProperty('--rgb','105,207,255');document.body.style.setProperty('--second','#b3fff0')}
if(theme==='red'){document.body.style.setProperty('--accent','#ff657f');document.body.style.setProperty('--rgb','255,101,127');document.body.style.setProperty('--second','#ffbd83')}
const device=['both','keyboard','mouse'].includes(q.get('device'))?q.get('device'):(q.get('mouse')==='0'?'keyboard':'both');
if(device!=='both')document.body.classList.add('only-'+device);
const design=['neon','glass','minimal','arcade'].includes(q.get('design'))?q.get('design'):'neon';document.body.classList.add('design-'+design);
document.querySelector('#name').textContent=(q.get('name')||'NEON / KEYS').slice(0,32).toUpperCase();
const rows=[[[27,'ESC'],[49,'1'],[50,'2'],[51,'3'],[52,'4'],[53,'5']],[[9,'TAB','tab'],[81,'Q','feature','YETENEK'],[87,'W','move'],[69,'E','feature','YETENEK'],[82,'R','','ŞARJÖR'],[84,'T']],[[16,'SHIFT','wide'],[65,'A','move'],[83,'S','move'],[68,'D','move'],[70,'F','','KULLAN'],[71,'G','','BIRAK']],[[17,'CTRL','wide'],[90,'Z'],[88,'X','feature','ULTİ'],[67,'C','feature','YETENEK'],[86,'V','','KONUŞ']],[[18,'ALT','wide'],[32,'SPACE','space','ZIPLA']]];
for(const row of rows){let r=document.createElement('div');r.className='row';for(const [vk,label,cls='',sub='']of row){let el=document.createElement('div');el.className='key '+cls;el.dataset.vk=vk;el.append(document.createTextNode(label));if(sub){let s=document.createElement('small');s.textContent=sub;el.append(s)}r.append(el)}document.querySelector('#board').append(r)}
const elements=[...document.querySelectorAll('[data-vk]')],status=document.querySelector('#status');let last=Date.now();
function render(keys){const set=new Set(keys);for(const el of elements)el.classList.toggle('on',set.has(+el.dataset.vk))}
if(q.get('demo')==='1'){
document.body.classList.add('demo-mode');status.textContent='DEMO';const frames=device==='mouse'?[[1],[],[2],[],[4],[1,2],[]]:[[87,16],[87,65],[68,2],[87,1],[1,32],[69,4],[81],[88],[82],[]];let i=0;render(frames[0]);setInterval(()=>render(frames[++i%frames.length]),650);
}else{
const stream=new EventSource('/events');stream.onmessage=e=>{last=Date.now();const data=JSON.parse(e.data);render(data.keys);status.textContent=data.paused?'DURAKLATILDI':'CANLI GİRDİ';document.querySelector('.mark').style.background=data.paused?'#ffc36b':''};stream.onerror=()=>{render([]);status.textContent='UYGULAMAYA BAĞLANILIYOR'};setInterval(()=>{if(Date.now()-last>2200){render([]);status.textContent='BAĞLANTI BEKLENİYOR'}},1000);
}
</script></html>
