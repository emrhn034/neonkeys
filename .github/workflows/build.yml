name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build standalone app
        shell: pwsh
        run: ./build.ps1
      - name: Check standalone app
        shell: pwsh
        run: ./scripts/smoke.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: NeonKeys-Windows
          path: |
            dist/NeonKeys.exe
            dist/NeonKeys.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG dist/NeonKeys.exe dist/NeonKeys.zip dist/SHA256SUMS.txt --verify-tag --title "NeonKeys $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
