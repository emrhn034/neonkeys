name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build standalone app
        shell: pwsh
        run: ./build.ps1
      - name: Check standalone app
        shell: pwsh
        run: ./scripts/smoke.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: NeonKeys-Windows
          path: |
            dist/NeonKeys.exe
            dist/NeonKeys.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish versioned release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if ($env:IS_TAG -eq 'true') {
            $releaseTag = $env:RELEASE_REF
          } else {
            $releaseTag = 'v' + (Get-Content -LiteralPath VERSION -Raw).Trim()
          }
          if ($releaseTag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Expected a vMAJOR.MINOR.PATCH release version.' }
          $releasesJson = gh release list --limit 100 --json tagName
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing releases.' }
          $releases = $releasesJson | ConvertFrom-Json
          if (@($releases | Where-Object { $_.tagName -eq $releaseTag }).Count -gt 0) {
            Write-Output "Release $releaseTag already exists; leaving it unchanged."
            exit 0
          }
          gh release create $releaseTag dist/NeonKeys.exe dist/NeonKeys.zip dist/SHA256SUMS.txt --target $env:RELEASE_COMMIT --title "NeonKeys $releaseTag" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
